[project]
name = "canvas-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhammad Cikal Merdeka", email = "mcikalmerdeka@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.13.0",
    "python-dotenv>=1.2.3",
    "requests>=2.32.0",
    "streamlit>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_copilot"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
